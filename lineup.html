<!DOCTYPE html>
<html lang="cs">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Match LineUP</title>

<meta name="theme-color" content="#00fff7">

<style>

/* =====================================================
   ZÁKLAD
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;

    background: #080b0d;

    color: #ffffff;

    min-height: 100vh;
}


/* =====================================================
   KONTEJNER
   ===================================================== */

.container {
    width: 100%;

    max-width: 1350px;

    margin: 0 auto;

    padding: 12px;
}


/* =====================================================
   NADPIS
   ===================================================== */

h1 {
    text-align: center;

    color: #00fff7;

    margin: 5px 0 15px;

    font-size: 28px;
}


/* =====================================================
   INFORMACE O ZÁPASE
   ===================================================== */

.match-info {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 8px;

    margin-bottom: 10px;
}

.match-info input {

    width: 260px;

    max-width: 100%;

    padding: 10px;

    border: 1px solid #00fff7;

    border-radius: 6px;

    background: #11181b;

    color: #ffffff;

    font-size: 15px;
}


/* =====================================================
   OVLÁDACÍ TLAČÍTKA
   ===================================================== */

.controls {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 7px;

    margin-bottom: 12px;
}

.controls select,
.controls button {

    padding: 10px 14px;

    border-radius: 6px;

    border: 1px solid #00fff7;

    background: #10171a;

    color: #ffffff;

    font-size: 15px;

    cursor: pointer;
}

.controls button:hover {

    background: #00fff7;

    color: #000000;
}


/* =====================================================
   EXPORTNÍ KONTEJNER
   ===================================================== */

#lineupExport {

    width: 100%;

    background: #164d20;

    padding: 12px;

    border-radius: 8px;
}


/* =====================================================
   HŘIŠTĚ
   ===================================================== */

#pitch {

    position: relative;

    width: 100%;

    max-width: 1250px;

    /*
       Poměr skutečného hřiště
       105 : 68
    */

    aspect-ratio: 105 / 68;

    margin: 0 auto;

    overflow: hidden;

    /*
       Pruhy trávy
    */

    background:
        repeating-linear-gradient(
            90deg,

            #21652a 0%,
            #21652a 7.14%,

            #2d7b35 7.14%,
            #2d7b35 14.28%
        );

    border: 4px solid #ffffff;

    border-radius: 4px;

    box-shadow:
        0 0 0 5px #174f23;

    touch-action: none;
}


/* =====================================================
   OBVOD HŘIŠTĚ
   ===================================================== */

.field-border {

    position: absolute;

    left: 0;
    top: 0;
    right: 0;
    bottom: 0;

    border: 2px solid #ffffff;

    z-index: 3;

    pointer-events: none;
}


/* =====================================================
   STŘEDOVÁ ČÁRA
   ===================================================== */

.halfway-line {

    position: absolute;

    left: 0;

    right: 0;

    top: 50%;

    height: 2px;

    background: #ffffff;

    transform: translateY(-50%);

    z-index: 3;

    pointer-events: none;
}


/* =====================================================
   STŘEDOVÝ KRUH
   ===================================================== */

.center-circle {

    position: absolute;

    width: 18.095%;

    aspect-ratio: 1 / 1;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    border: 2px solid #ffffff;

    border-radius: 50%;

    z-index: 3;

    pointer-events: none;
}


/* =====================================================
   STŘEDOVÝ BOD
   ===================================================== */

.center-spot {

    position: absolute;

    width: 8px;

    height: 8px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    background: #ffffff;

    border-radius: 50%;

    z-index: 5;

    pointer-events: none;
}


/* =====================================================
   VELKÉ VÁPNO
   ===================================================== */

.penalty-area {
    position: absolute;

    left: 50%;

    width: 57.1%;
    height: 15.71%;

    transform: translateX(-50%);

    border-left: 2px solid #fff;
    border-right: 2px solid #fff;

    z-index: 3;

    pointer-events: none;
}


/* Horní */

.penalty-area.top {
    top: 0;

    border-bottom: 2px solid #fff;
}


/* Dolní */

.penalty-area.bottom {
    bottom: 0;

    border-top: 2px solid #fff;
}


/* =====================================================
   MALÉ VÁPNO
   ===================================================== */

/*
   Hřiště má poměr 105 × 68 m.

   Malé vápno:
   šířka 18,32 m
   hloubka 5,50 m

   Proto:
   18,32 / 68 = 26,94 %
   5,50 / 105 = 5,24 %
*/

.goal-area {

    position: absolute;

    left: 50%;

    width: 26.94%;

    height: 5.24%;

    transform: translateX(-50%);

    border-left: 2px solid #ffffff;

    border-right: 2px solid #ffffff;

    z-index: 4;

    pointer-events: none;
}


/* HORNÍ MALÉ VÁPNO */

.goal-area.top {

    top: 0;

    /*
       Horní hrana není potřeba,
       protože ji tvoří branková čára.
    */

    border-top: none;

    border-bottom:
        2px solid #ffffff;
}


/* DOLNÍ MALÉ VÁPNO */

.goal-area.bottom {

    bottom: 0;

    border-bottom: none;

    border-top:
        2px solid #ffffff;
}


/* =====================================================
   PENALTOVÉ BODY
   ===================================================== */

/*
   Penaltový bod je přesně 11 m
   od brankové čáry.

   11 / 105 × 100 = 10,476 %

   Proto je nyní bod počítán
   přímo vůči CELÉMU HŘIŠTI.
*/

.penalty-spot {

    position: absolute;

    width: 8px;

    height: 8px;

    left: 50%;

    transform:
        translateX(-50%);

    background: #ffffff;

    border-radius: 50%;

    z-index: 7;

    pointer-events: none;
}


/* HORNÍ PENALTOVÝ BOD */

.penalty-spot.top {

    top: 10.48%;
}


/* DOLNÍ PENALTOVÝ BOD */

.penalty-spot.bottom {

    bottom: 10.48%;
}


/* =====================================================
   PENALTOVÝ OBLOUK
   ===================================================== */

/*
   Poloměr oblouku:
   9,15 m

   Průměr:
   18,30 m

   Šířka vzhledem k hřišti:
   18,30 / 68 = 26,91 %
*/

/* =====================================================
   PENALTOVÉ OBLOUKY – SPRÁVNÁ GEOMETRIE
   ===================================================== */

/*
   Skutečné rozměry:

   poloměr oblouku = 9,15 m
   průměr = 18,30 m

   Hřiště:
   délka = 105 m
   šířka = 68 m

   18,30 / 105 = 17,43 %
   18,30 / 68  = 26,91 %

   Proto:
   WIDTH  = 17,43 % šířky hřiště
   HEIGHT = 26,91 % výšky hřiště

   Tím vznikne skutečný KRUH,
   nikoliv natažená elipsa.
*/

.penalty-arc {

    position: absolute;

    left: 50%;

    /*
       Průměr 18,30 m
       vůči délce hřiště
    */

    width: 17.43%;

    /*
       Průměr 18,30 m
       vůči šířce hřiště
    */

    height: 26.91%;

    transform:
        translateX(-50%);

    border:
        2px solid #ffffff;

    border-radius: 50%;

    box-sizing: border-box;

    z-index: 5;

    pointer-events: none;
}


/* =====================================================
   HORNÍ PENALTOVÝ OBLOUK
   ===================================================== */

/*
   Penaltový bod:

   11 m od brankové čáry

   Poloměr:

   9,15 m

   Začátek kruhu:

   11 - 9,15
   = 1,85 m

   1,85 / 105
   = 1,76 %
*/

.penalty-arc.top {

    top: 1.76%;

    /*
       Zobrazit pouze část
       směřující do hřiště.
    */

    clip-path:
        inset(
            50% 0 0 0
        );
}


/* =====================================================
   DOLNÍ PENALTOVÝ OBLOUK
   ===================================================== */

.penalty-arc.bottom {

    bottom: 1.76%;

    /*
       Zobrazit horní část oblouku.
    */

    clip-path:
        inset(
            0 0 50% 0
        );
}


/* =====================================================
   ROHOVÉ OBLOUKY
   ===================================================== */

.corner-arc {

    position: absolute;

    width: 30px;
    height: 30px;

    border: 2px solid #fff;

    border-radius: 50%;

    z-index: 6;

    pointer-events: none;
}


.corner-arc.top-left {

    left: -15px;
    top: -15px;

    clip-path:
        inset(
            50% 0 0 50%
        );
}


.corner-arc.top-right {

    right: -15px;
    top: -15px;

    clip-path:
        inset(
            50% 50% 0 0
        );
}


.corner-arc.bottom-left {

    left: -15px;
    bottom: -15px;

    clip-path:
        inset(
            0 0 50% 50%
        );
}


.corner-arc.bottom-right {

    right: -15px;
    bottom: -15px;

    clip-path:
        inset(
            0 50% 50% 0
        );
}
/* =====================================================
   HRÁČ
   ===================================================== */

.player {

    position: absolute;

    width: 52px;

    height: 52px;

    transform:
        translate(-50%, -50%);

    background: #0878ff;

    border:
        2px solid #ffffff;

    border-radius: 50%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    color: #ffffff;

    cursor: grab;

    touch-action: none;

    user-select: none;

    z-index: 20;
}


.player:active {

    cursor: grabbing;
}


.player.selected {

    outline:
        3px solid #ff3030;

    outline-offset: 3px;
}


/* =====================================================
   ČÍSLO
   ===================================================== */

.player-number {

    font-size: 15px;

    font-weight: bold;

    line-height: 17px;
}


/* =====================================================
   POZICE
   ===================================================== */

.player-position {

    font-size: 8px;

    line-height: 9px;

    opacity: 0.9;
}


/* =====================================================
   JMÉNO
   ===================================================== */

.player-label {

    position: absolute;

    left: 50%;

    top:
        calc(100% + 5px);

    transform:
        translateX(-50%);

    min-width: 55px;

    padding:
        2px 5px;

    background:
        rgba(0,0,0,0.75);

    border-radius: 4px;

    color: #ffffff;

    font-size: 11px;

    white-space: nowrap;

    text-align: center;

    cursor: pointer;

    z-index: 30;
}


/* =====================================================
   LAVIČKA
   ===================================================== */

.bench-wrapper {

    max-width: 1000px;

    margin:
        25px auto 0;

    padding-top: 5px;
}


.bench-title {

    text-align: center;

    color: #00fff7;

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 12px;
}


#bench {

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 10px;
}


.bench-player {

    width: 85px;

    min-height: 68px;

    padding: 7px;

    background: #f28c00;

    color: #000000;

    border:
        2px solid #ffffff;

    border-radius: 8px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    user-select: none;
}


.bench-player.selected {

    outline:
        3px solid #ff3030;

    outline-offset: 3px;
}


.bench-number {

    font-size: 18px;

    font-weight: bold;
}


.bench-name {

    margin-top: 3px;

    font-size: 11px;

    max-width: 75px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

    cursor: pointer;
}


/* =====================================================
   NÁPOVĚDA
   ===================================================== */

.help {

    max-width: 900px;

    margin:
        12px auto 0;

    padding: 8px;

    text-align: center;

    font-size: 13px;

    color: #b9c5c8;
}


/* =====================================================
   MODAL
   ===================================================== */

#editModal {

    display: none;

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,0.75);

    z-index: 1000;

    align-items: center;

    justify-content: center;

    padding: 15px;
}


#editBox {

    width: 100%;

    max-width: 400px;

    background: #11181b;

    border:
        2px solid #00fff7;

    border-radius: 10px;

    padding: 20px;
}


#editBox h3 {

    margin-top: 0;

    color: #00fff7;
}


#playerNameInput {

    width: 100%;

    padding: 11px;

    font-size: 16px;

    border:
        1px solid #00fff7;

    border-radius: 6px;

    background: #05090a;

    color: #ffffff;
}


.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 12px;
}


.modal-buttons button {

    padding:
        9px 16px;

    border-radius: 6px;

    cursor: pointer;

    border:
        1px solid #00fff7;

    background: #10171a;

    color: #ffffff;
}


/* =====================================================
   TABLET
   ===================================================== */

@media (max-width: 900px) {

    .container {

        padding: 8px;
    }

    #lineupExport {

        padding: 8px;
    }

    .player {

        width: 46px;

        height: 46px;
    }

    .player-label {

        font-size: 10px;
    }
}


/* =====================================================
   MOBIL
   ===================================================== */

@media (max-width: 600px) {

    h1 {

        font-size: 22px;
    }

    .container {

        padding: 5px;
    }

    #lineupExport {

        padding: 5px;
    }

    #pitch {

        border-width: 3px;

        box-shadow:
            0 0 0 3px #174f23;
    }

    .player {

        width: 38px;

        height: 38px;
    }

    .player-number {

        font-size: 11px;

        line-height: 12px;
    }

    .player-position {

        font-size: 6px;

        line-height: 7px;
    }

    .player-label {

        top:
            calc(100% + 3px);

        font-size: 8px;

        min-width: 45px;
    }

    .bench-player {

        width: 70px;

        min-height: 58px;
    }

    .bench-title {

        font-size: 16px;
    }
}

</style>

</head>


<body>


<div class="container">


<h1>
⚽ Match LineUP
</h1>


<!-- =====================================================
     NÁZEV A DATUM ZÁPASU
     ===================================================== -->

<div class="match-info">

    <input
        type="text"
        id="matchName"
        placeholder="Název zápasu">

    <input
        type="date"
        id="matchDate">

</div>


<!-- =====================================================
     OVLÁDÁNÍ
     ===================================================== -->

<div class="controls">


    <select id="formationSelect">

        <option value="1-4-4-2">
            1-4-4-2
        </option>

        <option value="1-4-3-3">
            1-4-3-3
        </option>

        <option value="1-4-2-3-1">
            1-4-2-3-1
        </option>

    </select>


    <button id="createBtn">
        ⚽ Vytvořit sestavu
    </button>


    <button id="saveBtn">
        💾 Uložit
    </button>


    <button id="exportPngBtn">
        🖼️ Uložit PNG
    </button>


    <button id="exportPdfBtn">
        📄 Uložit PDF
    </button>


</div>


<!-- =====================================================
     EXPORT
     ===================================================== -->

<div id="lineupExport">


    <!-- =================================================
         HŘIŠTĚ
         ================================================= -->

  <div id="pitch">

    <div class="field-border"></div>

    <div class="halfway-line"></div>

    <div class="center-circle"></div>

    <div class="center-spot"></div>


<!-- =================================================
     HORNÍ POKUTOVÉ ÚZEMÍ
     ================================================= -->

<div class="penalty-area top"></div>


<!-- =================================================
     DOLNÍ POKUTOVÉ ÚZEMÍ
     ================================================= -->

<div class="penalty-area bottom"></div>


<!-- =================================================
     HORNÍ MALÉ VÁPNO
     ================================================= -->

<div class="goal-area top"></div>


<!-- =================================================
     DOLNÍ MALÉ VÁPNO
     ================================================= -->

<div class="goal-area bottom"></div>


<!-- =================================================
     HORNÍ PENALTOVÝ BOD
     ================================================= -->

<div class="penalty-spot top"></div>


<!-- =================================================
     DOLNÍ PENALTOVÝ BOD
     ================================================= -->

<div class="penalty-spot bottom"></div>


<!-- =================================================
     PENALTOVÉ OBLOUKY
     ================================================= -->

<div class="penalty-arc top"></div>

<div class="penalty-arc bottom"></div>


<!-- =================================================
     ROHOVÉ OBLOUKY
     ================================================= -->

<div class="corner-arc top-left"></div>

<div class="corner-arc top-right"></div>

<div class="corner-arc bottom-left"></div>

<div class="corner-arc bottom-right"></div>

    <!-- PENALTOVÉ OBLOUKY -->
        
    <!-- MUSÍ BÝT PŘÍMO V HŘIŠTI -->

    <div class="penalty-arc top"></div>

    <div class="penalty-arc bottom"></div>


    <!-- ROHOVÉ OBLOUKY -->

    <div class="corner-arc top-left"></div>

    <div class="corner-arc top-right"></div>

    <div class="corner-arc bottom-left"></div>

    <div class="corner-arc bottom-right"></div>

</div>




    <!-- =================================================
         LAVIČKA
         ================================================= -->

    <div class="bench-wrapper">


        <div class="bench-title">
            🪑 NÁHRADNÍCI
        </div>


        <div id="bench"></div>


    </div>


</div>


<!-- =====================================================
     NÁPOVĚDA
     ===================================================== -->

<div class="help">

    Kliknutím na hráče jej označíš pro výměnu.
    Kliknutím na druhého hráče nebo náhradníka
    provedeš výměnu.
    Kliknutím na jméno hráče můžeš jméno upravit.
    Hráče lze také přesouvat po hřišti.

</div>


</div>


<!-- =====================================================
     MODAL EDITACE JMÉNA
     ===================================================== -->

<div id="editModal">


    <div id="editBox">


        <h3>
            ✏️ Upravit jméno hráče
        </h3>


        <input
            type="text"
            id="playerNameInput"
            placeholder="Jméno hráče">


        <div class="modal-buttons">


            <button id="cancelNameBtn">
                Zrušit
            </button>


            <button id="confirmNameBtn">
                OK
            </button>


        </div>


    </div>


</div>


<!-- =====================================================
     KNIHOVNA PNG
     ===================================================== -->

<script
src="https://html2canvas.hertzen.com/dist/html2canvas.min.js">
</script>


<!-- =====================================================
     KNIHOVNA PDF
     ===================================================== -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<!-- =====================================================
     VLASTNÍ JAVASCRIPT
     ===================================================== -->

<script src="js/lineup.js"></script>


</body>

</html>
